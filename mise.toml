[tools]
go = "1.27"

[tasks.build]
description = "Build the CLI and the tray app"
run = [
  "go build -o bin/bulp ./cmd/bulp",
  "go build -o bin/bulp-menubar ./cmd/bulp-menubar",
]

[tasks.build-linux]
description = "Cross-compile static Linux binaries (amd64 + arm64) into bin/linux-*/"
env = { GOOS = "linux", CGO_ENABLED = "0" }
run = [
  "GOARCH=amd64 go build -o bin/linux-amd64/ ./cmd/...",
  "GOARCH=arm64 go build -o bin/linux-arm64/ ./cmd/...",
]

[tasks.test]
run = "go test ./..."

[tasks.menubar]
description = "Build and run the tray app"
depends = ["build"]
run = "./bin/bulp-menubar"

[tasks.flatpak]
description = "Build and install the Flatpak locally (flatpak run de.codecauldron.Bulp)"
run = [
  "go mod vendor", # the build has no network; removed again so local builds don't use it
  "flatpak run org.flatpak.Builder --user --install --force-clean --install-deps-from=flathub --repo=build/flatpak-repo build/flatpak packaging/flatpak/de.codecauldron.Bulp.yml; s=$?; rm -rf vendor; exit $s",
]

[tasks.appimage]
description = "Build build/Bulp-<version>-x86_64.AppImage (needs podman or docker)"
run = "packaging/appimage/build.sh"

[tasks.flatpak-bundle]
description = "Single-file build/de.codecauldron.Bulp.flatpak for releases (pulls the runtime from Flathub on install)"
depends = ["flatpak"]
run = "flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo build/flatpak-repo build/de.codecauldron.Bulp.flatpak de.codecauldron.Bulp"

[tasks.release]
description = "Build all release files into build/release/ (Flatpak bundle, AppImage, CLI binaries, SHA256SUMS)"
run = "packaging/release.sh"
